<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="../style/signup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
        <script src="../js/signup.js" defer></script>
</head>

<body>
    <main>
        <img src="../assets/images/planta.svg" alt="imagem de uma planta">
        <div class="steveJobs">
            <h1>The only way to <span>do great work</span> is to <span>love what you do.</span></h1>
            <p>- Steve Jobs</p>
        </div>
        <aside>
            <div class="formContainer">
                <h2>Sign Up</h2>
                <form action="" method="post">
                    <fieldset>
                        <img src="../assets/images/name.svg" alt="icone de um cartão de informações">
                        <input name="name" type="text" placeholder="your name" required>
                    </fieldset>
                    <fieldset>
                        <!-- <label for="email">Email</label> -->
                        <img src="../assets/images/email.svg" alt="icone de um envelope de email">
                        <input name="email" type="email" placeholder="your email" required>
                    </fieldset>
                    <fieldset>
                        <!-- <label for="password">Password</label> -->
                        <img src="../assets/images/key.svg" alt="icone de uma chave">
                        <input name="password" type="password" placeholder="your password" required>
                    </fieldset>
                    <button>
                        Sign Up
                    </button>
                    <div class="haveAccount">
                        <p>Have an account ?</p>
                        <a href="./login.html">Log in</a>
                    </div>
                    <div class="or">
                        <div class="line"></div>
                        <p>or</p>
                        <div class="line"></div>
                    </div>
                    <div class="buttonsWrapper">
                        <button>
                            <img src="../assets/images/google.svg" alt="logo da google">
                            <p>Google</p>
                        </button>
                        <button>
                            <img src="../assets/images/facebook.svg" alt="logo do facebook">
                            <p>Facebook</p>
                        </button>
                    </div>
                </form>
            </div>
        </aside>
    </main>
</body>

</html>
