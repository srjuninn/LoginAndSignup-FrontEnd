<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="/src/style/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script src="/src/js/login.js" defer></script>
</head>

<body>
    <main>
        <aside>
            <div class="formContainer">
                <h2>Log in</h2>
                <form id="loginForm" action="" method="post">
                    <fieldset>
                        <img src="/src/assets/images/email.svg" alt="icone de um envelope de email">
                        <input id="email" name="email" type="email" placeholder="your email" required>
                    </fieldset>
                    <fieldset>
                        <img src="/src/assets/images/key.svg" alt="icone de uma chave">
                        <input id="password" name="password" type="password" placeholder="your password" required>
                    </fieldset>
                    <button type="submit">
                        Log in
                    </button>
                    <div class="haveAccount">
                        <p>Don't have an account ?</p>
                        <a href="/src/pages/signup.html">Sign up</a>
                        <a href="">Forgot password?</a>
                    </div>
                    <div class="or">
                        <div class="line"></div>
                        <p>or</p>
                        <div class="line"></div>
                    </div>
                    <div class="buttonsWrapper">
                        <button>
                            <img src="/src/assets/images/google.svg" alt="logo da google">
                            <p>Google</p>
                        </button>
                        <button>
                            <img src="/src/assets/images/facebook.svg" alt="logo do facebook">
                            <p>Facebook</p>
                        </button>
                    </div>
                </form>
            </div>
        </aside>
        <img src="/src/assets/images/quarto.svg" alt="imagem de um quarto">
        <div class="EleanorRoosevelt">
            <h1>The future belongs to those who <span>believe</span> in the <span>beauty of their dreams.</span></h1>
            <p>- Eleanor Roosevelt</p>
        </div>
    </main>
</body>

</html>
